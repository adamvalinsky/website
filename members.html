    <section class="hero">
      <h1>VFlix Members Area</h1>

    <section>
      <div class="grid">
        <div class="card">
          <h3>VFlix</h3>
          <p>Watch your favorite movies and TV shows</p>
        </div>
      </div>
    </section>

    <section>
      <h2>Request a Movie or Show</h2>
      <p class="section-intro">Don't see something on VFlix? Request it below.</p>
      <div class="card">
        <form id="request-form">
          <input type="hidden" name="access_key" value="41f65e1a-4095-4471-9961-3e02e16a659f" />
          <input type="hidden" name="subject" value="New VFlix Request" />
          <input type="hidden" name="from_name" value="VFlix Request Form" />
          <div class="form-field">
            <label for="request-title">Title</label>
            <input id="request-title" name="request-title" type="text" placeholder="e.g. The Matrix" required />
          </div>
          <div class="form-field">
            <label for="request-type">Type</label>
            <select id="request-type" name="request-type">
              <option value="movie">Movie</option>
              <option value="tv">TV Show</option>
            </select>
          </div>
          <div class="form-field">
            <label for="request-notes">Notes (optional)</label>
            <textarea id="request-notes" name="request-notes" placeholder="Any details — year, season, etc."></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Submit Request</button>
          <p id="request-status" class="auth-success" style="margin-top: 16px;"></p>
        </form>
      </div>
    </section>
