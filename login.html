  <main class="container">
    <section class="hero">
      <h1>Member Login</h1>
      <p class="lede">Sign in to access VFlix.</p>
    </section>

    <section>
      <div class="auth-card">
        <form id="login-form">
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="auth-error" role="alert"></p>
          <button class="btn btn-primary" type="submit">Log In</button>
        </form>
        <p style="margin-top: 16px;">
          <button id="forgot-password-btn" class="btn-link" type="button">Forgot password?</button>
        </p>
        <p id="forgot-password-status" role="status"></p>
      </div>
    </section>
