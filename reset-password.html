<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Adam Valinsky</title>
  <meta name="description" content="Set a new password for your member account." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="index.html">Adam Valinsky</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <a class="btn btn-secondary nav-login" href="login.html">Member Login</a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Reset Password</h1>
      <p class="lede">Choose a new password for your account.</p>
    </section>

    <section>
      <div class="auth-card">
        <form id="reset-password-form">
          <div class="form-field">
            <label for="reset-new-password">New Password</label>
            <input id="reset-new-password" name="reset-new-password" type="password" autocomplete="new-password" required />
          </div>
          <div class="form-field">
            <label for="reset-confirm-password">Confirm New Password</label>
            <input id="reset-confirm-password" name="reset-confirm-password" type="password" autocomplete="new-password" required />
          </div>
          <p id="reset-password-status" role="alert" style="margin: 0 0 16px; min-height: 1.2em; font-size: 0.9rem;"></p>
          <button class="btn btn-primary" type="submit">Set New Password</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Adam Valinsky</span>
      <ul class="footer-links">
        <li><a href="mailto:placeholder@example.com">Email</a></li>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">GitHub</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
